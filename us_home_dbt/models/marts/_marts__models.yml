version: 2

models:
  - name: fct_home_values_rents_monthly
    description: >
      Zillow home values and rents by region and month, with 1- and 5-year
      percent changes. Covers the US, states, metros, and ZIP codes, as far as
      Zillow publishes each measure (no state-level rents; ZIP-level home
      values not loaded yet). Feeds report sections 1 (home prices) and 2
      (rents). Data Provided by Zillow Group.
    columns:
      - name: region_id
        description: Zillow's region ID.
        data_tests:
          - not_null
      - name: geography_level
        description: national, state, metro, or zip.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['national', 'state', 'metro', 'zip']
      - name: region_name
        description: '"United States", a state name, a metro name, or a 5-digit ZIP code.'
        data_tests:
          - not_null
      - name: zip_code
        description: 5-digit ZIP code (zip level only).
      - name: state_code
        description: Two-letter state abbreviation (zip and metro level).
      - name: state_name
        description: Full state name (state level only).
      - name: city
        description: City (zip level only).
      - name: metro_name
        description: Metro area name (metro level, and the ZIP's metro at zip level).
      - name: county_name
        description: County name (zip level only).
      - name: month_start_date
        description: First day of the month.
        data_tests:
          - not_null
      - name: month_end_date
        description: Last day of the month (Zillow's date convention).
        data_tests:
          - not_null
      - name: typical_home_value
        description: Zillow Home Value Index (ZHVI), mid tier (35th-65th percentile), smoothed and seasonally adjusted, USD.
      - name: bottom_tier_home_value
        description: ZHVI bottom tier (5th-35th percentile), USD. Stand-in for the lowest-priced homes.
      - name: top_tier_home_value
        description: ZHVI top tier (65th-95th percentile), USD. Stand-in for the highest-priced homes.
      - name: typical_rent
        description: Zillow Observed Rent Index (ZORI), all homes plus multifamily, smoothed, USD per month.
      - name: typical_home_value_change_1y_pct
        description: Percent change in typical_home_value from the same month a year earlier (5.0 means +5%). NULL if that month is missing.
      - name: typical_home_value_change_5y_pct
        description: Percent change in typical_home_value from the same month five years earlier. NULL if that month is missing.
      - name: typical_rent_change_1y_pct
        description: Percent change in typical_rent from the same month a year earlier. NULL if that month is missing.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region_id
              - month_start_date
      # Every row should hold at least one measure
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              coalesce(typical_home_value, bottom_tier_home_value,
              top_tier_home_value, typical_rent) is not null
      - dbt_utils.expression_is_true:
          arguments:
            expression: "bottom_tier_home_value <= typical_home_value and typical_home_value <= top_tier_home_value"
          config:
            where: "bottom_tier_home_value is not null and top_tier_home_value is not null"

  - name: home_values_rents_current
    description: >
      Latest home value and rent figures per region: the headline numbers for
      report sections 1 and 2. Home values and rents each carry their own "as
      of" month, since a region's latest month can differ by measure.
      Data Provided by Zillow Group.
    columns:
      - name: region_id
        description: Zillow's region ID.
        data_tests:
          - not_null
          - unique
      - name: geography_level
        description: national, state, metro, or zip.
        data_tests:
          - not_null
      - name: region_name
        description: '"United States", a state name, a metro name, or a 5-digit ZIP code.'
      - name: zip_code
        description: 5-digit ZIP code (zip level only).
      - name: state_code
        description: Two-letter state abbreviation (zip and metro level).
        data_tests:
          - relationships:
              arguments:
                to: ref('states')
                field: state_code
      - name: state_name
        description: Full state name (state level only).
        data_tests:
          - relationships:
              arguments:
                to: ref('states')
                field: state_name
      - name: city
        description: City (zip level only).
      - name: metro_name
        description: Metro area name.
      - name: county_name
        description: County name (zip level only).
      - name: home_value_as_of
        description: Month-end date of the latest home value.
      - name: typical_home_value
        description: Latest ZHVI mid tier, USD.
      - name: bottom_tier_home_value
        description: Latest ZHVI bottom tier, USD.
      - name: top_tier_home_value
        description: Latest ZHVI top tier, USD.
      - name: typical_home_value_change_1y_pct
        description: 1-year percent change in typical home value.
      - name: typical_home_value_change_5y_pct
        description: 5-year percent change in typical home value.
      - name: rent_as_of
        description: Month-end date of the latest rent.
      - name: typical_rent
        description: Latest ZORI, USD per month.
      - name: typical_rent_change_1y_pct
        description: 1-year percent change in typical rent.

  - name: fct_mortgage_rates
    description: >
      Mortgage rates by loan type and date (report section 3), from FRED:
      Freddie Mac's weekly survey (conventional 30- and 15-year fixed) and
      Optimal Blue's daily indexes (conforming, jumbo, FHA, VA, USDA). Each rate
      carries the 10-year Treasury yield from the same date, or the latest
      business day before it, and the spread between them. Data from FRED,
      Federal Reserve Bank of St. Louis.
    columns:
      - name: series_id
        description: FRED series ID (labels in the mortgage_rate_series seed).
        data_tests:
          - not_null
      - name: rate_name
        description: Readable rate name, e.g. "30-year fixed FHA".
      - name: rate_source
        description: Original publisher of the rate.
      - name: loan_type
        description: conventional, conforming, jumbo, FHA, VA, or USDA.
      - name: term_years
        description: Loan term in years.
      - name: frequency
        description: weekly or daily.
      - name: display_order
        description: Sort order in the report.
      - name: rate_date
        description: Observation date (Thursdays for the weekly series).
        data_tests:
          - not_null
      - name: rate_pct
        description: Average rate in percent (7.11 means 7.11%).
        data_tests:
          - not_null
      - name: treasury_date
        description: Date of the 10-year Treasury yield matched to this rate.
      - name: treasury_10y_pct
        description: 10-year Treasury constant maturity yield, percent (FRED DGS10).
      - name: spread_to_treasury_pct_pts
        description: rate_pct minus treasury_10y_pct, in percentage points.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - series_id
              - rate_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rate_pct between 0 and 25"
      # The matched Treasury yield must be recent, not a stale value from a data gap
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rate_date - treasury_date <= 7"
          config:
            where: "treasury_date is not null"

  - name: mortgage_rates_current
    description: >
      Latest value of each mortgage rate with its change over one week and one
      year, its 52-week range, and its spread over the 10-year Treasury: the
      headline numbers for report section 3. Changes compare with the latest
      observation on or before the same date a week or a year earlier.
      Data from FRED, Federal Reserve Bank of St. Louis.
    columns:
      - name: series_id
        description: FRED series ID.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('mortgage_rate_series')
                field: series_id
      - name: rate_name
        description: Readable rate name.
      - name: rate_as_of
        description: Date of the latest observation.
        data_tests:
          - not_null
      - name: rate_pct
        description: Latest rate, percent.
        data_tests:
          - not_null
      - name: change_1w_pct_pts
        description: Change from a week earlier, percentage points.
      - name: change_1y_pct_pts
        description: Change from a year earlier, percentage points.
      - name: low_52w_pct
        description: Lowest rate in the 52 weeks up to rate_as_of.
      - name: high_52w_pct
        description: Highest rate in the 52 weeks up to rate_as_of.
      - name: treasury_10y_pct
        description: 10-year Treasury yield matched to rate_as_of.
      - name: spread_to_treasury_pct_pts
        description: Latest rate minus the 10-year Treasury yield, percentage points.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rate_pct between low_52w_pct and high_52w_pct"

  - name: affordability_current
    description: >
      Affordability of the typical home in each region (report section 4, v1).
      The monthly payment is principal and interest only on a 30-year fixed
      loan with 20% down (dbt vars affordability_down_payment_pct and
      affordability_loan_term_years), at the latest Freddie Mac 30-year rate;
      property tax and insurance are planned for v2. The payment a year
      earlier uses the home value from the same month a year before and the
      rate from the same date a year before. Data Provided by Zillow Group.
      Data from FRED, Federal Reserve Bank of St. Louis.
    columns:
      - name: region_id
        description: Zillow's region ID.
        data_tests:
          - not_null
          - unique
      - name: geography_level
        description: national, state, metro, or zip.
      - name: region_name
        description: '"United States", a state name, a metro name, or a 5-digit ZIP code.'
      - name: home_value_as_of
        description: Month-end date of the home value used.
      - name: typical_home_value
        description: Zillow Home Value Index (mid tier), USD.
      - name: rate_as_of
        description: Date of the Freddie Mac 30-year rate used.
      - name: mortgage_rate_30y_pct
        description: Freddie Mac 30-year fixed rate, percent.
      - name: down_payment_pct
        description: Down payment assumed, percent of the home value.
      - name: loan_term_years
        description: Loan term assumed, years.
      - name: loan_amount
        description: typical_home_value minus the down payment, USD.
      - name: monthly_payment
        description: Monthly principal and interest, USD (no tax or insurance).
        data_tests:
          - not_null
      - name: home_value_1y_ago
        description: Typical home value in the same month a year earlier, USD.
      - name: rate_1y_ago_as_of
        description: Date of the 30-year rate used for the year-earlier payment.
      - name: mortgage_rate_30y_1y_ago_pct
        description: Freddie Mac 30-year rate a year earlier, percent.
      - name: monthly_payment_1y_ago
        description: Monthly principal and interest a year earlier, USD.
      - name: monthly_payment_change_1y_pct
        description: Percent change in the monthly payment over the year.
      - name: rent_as_of
        description: Month-end date of the latest rent.
      - name: typical_rent
        description: Zillow Observed Rent Index, USD per month.
      - name: price_to_rent_ratio
        description: >
          typical_home_value divided by a year of typical_rent. Higher means
          buying is expensive relative to renting. Only filled when value and
          rent are from the same month.
      - name: income_year
        description: Year of the median household income (national row only).
      - name: median_household_income
        description: US median household income in current dollars (FRED MEHOINUSA646N), national row only.
      - name: payment_to_income_pct
        description: >
          Annual principal and interest as a percent of median household
          income (national row only). A common rule of thumb treats housing
          costs above 30% of income as unaffordable.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "monthly_payment > 0 and loan_amount < typical_home_value"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "geography_level = 'national'"
          config:
            where: "payment_to_income_pct is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "price_to_rent_ratio > 0"
          config:
            where: "price_to_rent_ratio is not null"
