version: 2

sources:
  - name: fred
    description: >
      Federal Reserve Economic Data (FRED), Federal Reserve Bank of St. Louis.
      Loaded by load/load_fred.py from the FRED API (43 national series).
    schema: raw_fred
    tables:
      - name: observations
        description: >
          One row per series per observation date, upserted on each load.
          Missing observations (FRED's ".") are stored as NULL.
        columns:
          - name: series_id
            description: FRED series ID, e.g. MORTGAGE30US.
            data_tests:
              - not_null
          - name: observation_date
            description: >
              Start of the observation period (e.g. 2026-10-01 for October
              2026 monthly data; the week's date for weekly series).
            data_tests:
              - not_null
          - name: value
            description: Observed value; NULL where FRED reports no value.
          - name: loaded_at
            description: When the row was last inserted or updated by the load script.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - series_id
                  - observation_date
