version: 2

seeds:
  - name: mortgage_rate_series
    description: >
      Labels for the FRED mortgage rate series used in report section 3: a
      readable name, the original publisher, loan type, term, and how often the
      series is published. display_order sets the order rates appear in the report.
    config:
      column_types:
        term_years: integer
        display_order: integer
    columns:
      - name: series_id
        description: FRED series ID.
        data_tests:
          - not_null
          - unique
          # Every labeled series must actually be loaded from FRED
          - relationships:
              arguments:
                to: ref('stg_fred__observations')
                field: series_id
      - name: rate_name
        description: Readable name used in the report.
        data_tests:
          - not_null
      - name: rate_source
        description: Original publisher of the rate (FRED redistributes it).
      - name: loan_type
        description: conventional, conforming, jumbo, FHA, VA, or USDA.
      - name: term_years
        description: Loan term in years.
      - name: frequency
        description: weekly (Freddie Mac, Thursdays) or daily (Optimal Blue, business days).
        data_tests:
          - accepted_values:
              arguments:
                values: ['weekly', 'daily']
      - name: display_order
        description: Sort order in the report.
        data_tests:
          - unique

  - name: states
    description: >
      The 50 states and the District of Columbia with their FIPS codes, postal
      abbreviations, and names, from the Census Bureau's state code file
      (https://www2.census.gov/geo/docs/reference/state.txt, retrieved
      2026-11-18). Territories are left out because the loaded sources don't
      cover them. First piece of the shared geography dimension: it links
      Zillow's state names (state level) and abbreviations (ZIP and metro level).
    config:
      column_types:
        state_fips: varchar
    data_tests:
      # FIPS codes must be exactly two digits (leading zero kept)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "regexp_full_match(state_fips, '[0-9]{2}')"
    columns:
      - name: state_fips
        description: 2-digit state FIPS code, kept as text ("01" for Alabama).
        data_tests:
          - not_null
          - unique
      - name: state_code
        description: 2-letter USPS abbreviation.
        data_tests:
          - not_null
          - unique
      - name: state_name
        description: Full state name, as Zillow spells it.
        data_tests:
          - not_null
          - unique

  - name: market_panel_series
    description: >
      Labels for the national FRED series in the market panel (report
      sections 5, 6, and 11). Titles, units, and seasonal adjustment were
      taken from FRED's series metadata on 2026-11-18. change_type says
      whether the 1-year change is a percent change (pct: counts and levels)
      or a difference in percentage points (pts: rates and shares).
      is_derived marks series calculated in this project rather than loaded.
    config:
      column_types:
        report_section: integer
        is_derived: boolean
        display_order: integer
    columns:
      - name: series_id
        description: FRED series ID, or a project-defined ID for derived series.
        data_tests:
          - not_null
          - unique
          # Every loaded (non-derived) series must exist in the FRED data
          - relationships:
              arguments:
                to: ref('stg_fred__observations')
                field: series_id
              config:
                where: "not is_derived"
      - name: report_section
        description: Report section number (5, 6, or 11).
        data_tests:
          - accepted_values:
              arguments:
                values: [5, 6, 11]
                quote: false
      - name: section_name
        description: Report section name.
      - name: metric_name
        description: Readable name used in the report.
        data_tests:
          - not_null
      - name: units
        description: Units of the value, from FRED.
      - name: seasonal_adjustment
        description: Seasonal adjustment, from FRED.
      - name: publisher
        description: Original publisher of the data (FRED redistributes it).
      - name: change_type
        description: pct (percent change) or pts (percentage-point difference).
        data_tests:
          - accepted_values:
              arguments:
                values: ['pct', 'pts']
      - name: is_derived
        description: True if calculated in this project from other series.
        data_tests:
          - not_null
      - name: display_order
        description: Sort order in the report.
        data_tests:
          - unique
